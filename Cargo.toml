[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/capture", "crates/render", "app/src-tauri"]

[workspace.package]
edition = "2021"
version = "0.2.8"
license = "MIT"

[workspace.dependencies]
parser = { path = "third_party/demoparser/parser" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
lto = "thin"

# The parser is the hot path; keep it optimized even in dev builds.
[profile.dev.package.parser]
opt-level = 3
[profile.dev.package.csgoproto]
opt-level = 3
