[package]
name = "cs2hl-capture"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "cs2hl-capture"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
hound = "3.5.1"
wasapi = "0.25.0"
windows-capture = "1"

[dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_Variant"]
