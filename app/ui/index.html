<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS2 Highlights</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">◆</span> CS2 HIGHLIGHTS</div>
    <nav class="tabs">
      <a href="#/" data-nav="home">Calendar</a>
      <a href="#/latest" data-nav="latest">Latest session</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
    <div class="status" id="status" title="Background processing">Idle</div>
  </header>
  <main id="view" class="view"></main>

  <div class="player-modal" id="player" hidden>
    <div class="player-box">
      <div class="player-head">
        <div>
          <div class="player-title" id="player-title"></div>
          <div class="player-sub" id="player-sub"></div>
        </div>
        <button class="icon-btn" id="player-close" aria-label="Close">✕</button>
      </div>
      <video id="player-video" controls autoplay playsinline></video>
      <div class="player-actions">
        <button class="btn" id="player-prev">◀ Previous</button>
        <button class="btn" id="player-next">Next ▶</button>
        <span class="grow"></span>
        <button class="btn ghost" id="player-folder">Show in folder</button>
        <button class="btn ghost" id="player-copy">Copy file</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
