<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veloxify</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Saved theme (Settings > Appearance), applied before the first paint.
    try {
      const t = JSON.parse(localStorage.getItem("veloxify.theme") || "{}");
      if (t.preset && t.preset !== "faceit") document.documentElement.dataset.theme = t.preset;
      if (t.accent) {
        document.documentElement.style.setProperty("--accent", t.accent);
        const n = parseInt(t.accent.slice(1), 16);
        const lum = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => { v /= 255; return v <= 0.04 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; });
        document.documentElement.style.setProperty("--on-accent", 0.2126 * lum[0] + 0.7152 * lum[1] + 0.0722 * lum[2] > 0.3 ? "#04121a" : "#ffffff");
      }
    } catch (e) { /* default theme */ }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">

      <span class="wordmark">veloxify</span>
    </div>
    <nav class="tabs">
      <a href="#/profile" data-nav="profile">Profile</a>
      <a href="#/matches" data-nav="matches">Match history</a>
      <a href="#/clips" data-nav="clips">Clips</a>
      <a href="#/latest" data-nav="latest">Latest session</a>

  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view" class="view"></main>

  <div class="player-modal" id="player" hidden>
    <div class="player-box">
      <div class="player-head">
        <div>
          <div class="player-title" id="player-title"></div>
          <div class="player-sub" id="player-sub"></div>
        </div>
        <button class="btn ghost" id="player-theater" title="Theater mode (T)">Theater</button>
        <button class="icon-btn" id="player-close" aria-label="Close">✕</button>
      </div>
      <video id="player-video" controls autoplay playsinline></video>
      <div class="player-actions">
        <button class="btn" id="player-prev">◀ Previous</button>
        <button class="btn" id="player-next">Next ▶</button>
        <span class="grow"></span>
        <button class="btn ghost" id="player-folder">Show in folder</button>
        <button class="btn ghost" id="player-copy">Copy file</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
